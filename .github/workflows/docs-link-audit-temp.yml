name: docs-link-audit-temp

on:
  push:
    branches:
      - review/pedagogy-pass-2026-08

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/pedagogy-pass-2026-08
          fetch-depth: 0
      - name: Rewrite stale documentation references and install permanent checker
        run: python3 scripts/audit_and_fix_docs_links.py
      - name: Remove one-shot audit files before permanent checks
        run: |
          rm -f \
            scripts/audit_and_fix_docs_links.py \
            .github/workflows/docs-link-audit-temp.yml
      - name: Install static tools and a buildable kernel headers tree
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck linux-headers-generic
      - name: Shell syntax, ShellCheck, Markdown links, kernel-facing checkpatch
        run: ./scripts/quality.sh .
      - name: Check Lab teaching structure
        run: python3 scripts/check_pedagogy_structure.py
      - name: Check canonical documentation architecture
        run: python3 scripts/check_docs_architecture.py
      - name: Check all Markdown links and superseded references
        run: python3 scripts/check_docs_links_and_references.py
      - name: Build userspace runtime and CLI
        run: make -C runtime clean all
      - name: Compile Labs 00-07 as external modules
        shell: bash
        run: |
          set -euo pipefail
          KDIR=$(find /usr/src -maxdepth 1 -type d \
            -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          test -n "$KDIR"
          for lab in \
            labs/00-hello-module \
            labs/01-debugfs-logging \
            labs/02-char-device \
            labs/03-ioctl-poll-mmap \
            labs/04-locking-and-races \
            labs/05-pci-edu-mmio \
            labs/06-pci-edu-irq \
            labs/07-pci-edu-dma; do
            make -C "$lab" KDIR="$KDIR"
          done
      - name: Check whitespace
        run: git diff --check
      - name: Commit repaired links and permanent audit gate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Documentation links were already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: repair and permanently audit Markdown references"
          git push origin HEAD:review/pedagogy-pass-2026-08
